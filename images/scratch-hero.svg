<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Pedalboard banner</title>
<desc id="d">Three stylized guitar pedals in amber and charcoal on a dark background with a patch cable running between them.</desc>
